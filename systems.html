<!DOCTYPE html>
<html>

<head>
    <title>Aircraft Systems</title>
    <link rel="stylesheet" href="style.css">
</head>


<body>


<nav class="navbar">

    <div class="logo">
        AVIATION SYSTEMS
    </div>


    <div class="nav-links">
        <a href="index.html">Home</a>
        <a href="systems.html">Systems</a>
    </div>

</nav>



<h1 class="title">
    AIRCRAFT SYSTEMS
</h1>



<div class="system-grid">

    <button onclick="openInfo('TCAS')">
        TCAS
    </button>


    <button onclick="openInfo('TAWS')">
        TAWS
    </button>


    <button onclick="openInfo('FMS')">
        FMS
    </button>


    <button onclick="openInfo('Weather Radar')">
        Weather Radar
    </button>


    <button onclick="openInfo('Autopilot')">
        Autopilot
    </button>


    <button onclick="openInfo('ILS')">
        ILS
    </button>

</div>




<div id="info-panel">

    <h2 id="info-title">
        Select a system
    </h2>


    <p id="info-text">
        Click a system to learn more.
    </p>

</div>





<script>

function openInfo(system) {

    let title = document.getElementById("info-title");
    let text = document.getElementById("info-text");

    let panel = document.getElementById("info-panel");


    panel.classList.add("show");


    if (system === "TCAS") {

        title.innerHTML = "TCAS";

        text.innerHTML =
        "Traffic Collision Avoidance System. Detects nearby aircraft and provides collision avoidance advisories.";

    }


    if (system === "TAWS") {

        title.innerHTML = "TAWS";

        text.innerHTML =
        "Terrain Awareness and Warning System. Warns pilots about dangerous terrain and obstacles.";

    }


    if (system === "FMS") {

        title.innerHTML = "FMS";

        text.innerHTML =
        "Flight Management System. Manages navigation, routes, and aircraft performance.";

    }


    if (system === "Weather Radar") {

        title.innerHTML = "Weather Radar";

        text.innerHTML =
        "Detects storms, precipitation, and dangerous weather ahead of the aircraft.";

    }


    if (system === "Autopilot") {

        title.innerHTML = "Autopilot";

        text.innerHTML =
        "Automatically controls aircraft flight path, altitude, and heading.";

    }


    if (system === "ILS") {

        title.innerHTML = "ILS";

        text.innerHTML =
        "Instrument Landing System. Provides precision guidance during landing.";

    }

}


</script>



</body>

</html>
