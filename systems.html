<!DOCTYPE html>
<html>

<head>

    <title>Aircraft Systems</title>

    <link rel="stylesheet" href="style.css">

</head>


<body>


<nav class="navbar">

    <div class="logo">
        AVIATION SYSTEMS
    </div>


    <div class="nav-links">
        <a href="index.html">Home</a>
        <a href="systems.html">Systems</a>
    </div>

</nav>




<h1 class="title">
    AIRCRAFT SYSTEMS
</h1>




<div class="system-grid">


    <div class="system-item" onclick="openInfo('TCAS')">
        TCAS
    </div>


    <div class="system-item" onclick="openInfo('TAWS')">
        TAWS
    </div>


    <div class="system-item" onclick="openInfo('GPWS')">
        GPWS
    </div>


    <div class="system-item" onclick="openInfo('Windshear Detection')">
        Windshear Detection
    </div>


    <div class="system-item" onclick="openInfo('Weather Radar')">
        Weather Radar
    </div>


    <div class="system-item" onclick="openInfo('Predictive Windshear')">
        Predictive Windshear
    </div>


    <div class="system-item" onclick="openInfo('Stall Warning')">
        Stall Warning
    </div>


    <div class="system-item" onclick="openInfo('Overspeed Warning')">
        Overspeed Warning
    </div>


    <div class="system-item" onclick="openInfo('Altitude Alert')">
        Altitude Alert
    </div>


    <div class="system-item" onclick="openInfo('Traffic Display')">
        Traffic Display
    </div>


</div>





<div id="info-panel">


    <h2 id="info-title">
        Select a System
    </h2>


    <p id="info-text">
        Click a system to view information.
    </p>


</div>






<script>


function openInfo(system) {


    let title = document.getElementById("info-title");

    let text = document.getElementById("info-text");

    let panel = document.getElementById("info-panel");


    panel.classList.add("show");



    if(system === "TCAS") {

        title.innerHTML = "TCAS";

        text.innerHTML =
        "Traffic Collision Avoidance System. Detects nearby aircraft using transponders and provides pilots with collision avoidance advisories.";

    }



    if(system === "TAWS") {

        title.innerHTML = "TAWS";

        text.innerHTML =
        "Terrain Awareness and Warning System. Uses terrain databases, GPS, and aircraft data to warn pilots of dangerous terrain.";

    }



    if(system === "GPWS") {

        title.innerHTML = "GPWS";

        text.innerHTML =
        "Ground Proximity Warning System. Warns pilots about unsafe proximity to the ground.";

    }



    if(system === "Windshear Detection") {

        title.innerHTML = "Windshear Detection";

        text.innerHTML =
        "Detects sudden changes in wind direction and speed that could threaten aircraft during takeoff or landing.";

    }



    if(system === "Weather Radar") {

        title.innerHTML = "Weather Radar";

        text.innerHTML =
        "Uses radar waves to detect precipitation, storms, and dangerous weather ahead.";

    }



    if(system === "Predictive Windshear") {

        title.innerHTML = "Predictive Windshear";

        text.innerHTML =
        "Uses weather radar technology to detect windshear before the aircraft enters it.";

    }



    if(system === "Stall Warning") {

        title.innerHTML = "Stall Warning";

        text.innerHTML =
        "Warns pilots when the aircraft is approaching a stall condition.";

    }



    if(system === "Overspeed Warning") {

        title.innerHTML = "Overspeed Warning";

        text.innerHTML =
        "Alerts pilots when the aircraft exceeds safe speed limits.";

    }



    if(system === "Altitude Alert") {

        title.innerHTML = "Altitude Alert";

        text.innerHTML =
        "Warns pilots when approaching or deviating from a selected altitude.";

    }



    if(system === "Traffic Display") {

        title.innerHTML = "Traffic Display";

        text.innerHTML =
        "Displays nearby aircraft detected through onboard traffic systems.";

    }


}


</script>



</body>

</html>
