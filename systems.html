<!DOCTYPE html>
<html>

<head>

    <title>Aircraft Systems</title>

    <link rel="stylesheet" href="systems.css">

</head>


<body>


<nav class="navbar">

    <div class="logo">
        AVIATION SYSTEMS
    </div>


    <div class="nav-links">

        <a href="index.html">Home</a>

        <a href="systems.html">Systems</a>

    </div>

</nav>




<h1 class="title">
    AIRCRAFT SYSTEMS
</h1>




<div class="system-box">

<div class="system-grid">


    <div class="system-item" onclick="openInfo('TCAS')">
        TCAS
    </div>


    <div class="system-item" onclick="openInfo('TAWS')">
        TAWS
    </div>


    <div class="system-item" onclick="openInfo('GPWS')">
        GPWS
    </div>


    <div class="system-item" onclick="openInfo('Windshear Detection')">
        Windshear Detection
    </div>


    <div class="system-item" onclick="openInfo('Weather Radar')">
        Weather Radar
    </div>


    <div class="system-item" onclick="openInfo('Predictive Windshear')">
        Predictive Windshear
    </div>


    <div class="system-item" onclick="openInfo('Stall Warning')">
        Stall Warning
    </div>


    <div class="system-item" onclick="openInfo('Overspeed Warning')">
        Overspeed Warning
    </div>


    <div class="system-item" onclick="openInfo('Altitude Alert')">
        Altitude Alert
    </div>


    <div class="system-item" onclick="openInfo('Traffic Display')">
        Traffic Display
    </div>


</div>

</div>





<div id="info-panel">

<button id="close-btn" onclick="closeInfo()">✕</button>


<h2 id="info-title">
    Select a System
</h2>


<p id="info-text">
    Click a system to view information.
</p>


</div>







<script>

function openInfo(system){


let title=document.getElementById("info-title");

let text=document.getElementById("info-text");

let panel=document.getElementById("info-panel");


panel.classList.add("show");



let information = {


"TCAS":

`
<b>Traffic Collision Avoidance System (TCAS)</b><br><br>

TCAS is an airborne safety system designed to prevent mid-air collisions between aircraft.

It works independently from air traffic control by communicating with nearby aircraft through their transponders.

TCAS calculates aircraft position, altitude, distance, and movement to determine if another aircraft is becoming a threat.

<br><br>

When a possible conflict is detected, TCAS first gives a <b>Traffic Advisory (TA)</b>.

A TA tells pilots that nearby traffic requires attention.

<br><br>

If the situation becomes dangerous, TCAS issues a <b>Resolution Advisory (RA)</b>.

The RA gives pilots a vertical command such as:

<br><br>

<b>CLIMB</b><br>
<b>DESCEND</b><br>
<b>MAINTAIN VERTICAL SPEED</b>

<br><br>

Modern TCAS systems coordinate between aircraft.

One aircraft may receive a climb command while the other receives a descent command to avoid both aircraft moving toward each other.

<br><br>

<b>THE GOLDEN RULE OF TCAS:</b>

<br><br>

If TCAS issues a Resolution Advisory (RA), pilots follow the TCAS command immediately, even if it conflicts with an ATC instruction.

<br><br>

<b>"TCAS RA first. ATC second."</b>
`,



"TAWS":

`
<b>Terrain Awareness and Warning System (TAWS)</b><br><br>

TAWS protects aircraft from Controlled Flight Into Terrain (CFIT).

It combines GPS position, aircraft altitude, speed, and a worldwide terrain database.

<br><br>

The system constantly checks if the aircraft flight path is approaching dangerous terrain.

Warnings can include:

<br><br>

<b>TERRAIN AHEAD</b><br>
<b>PULL UP</b><br>
<b>TERRAIN TERRAIN</b>

<br><br>

TAWS is especially important during night flights, poor weather, and mountain operations.
`,



"GPWS":

`
<b>Ground Proximity Warning System (GPWS)</b><br><br>

GPWS was designed to warn pilots when the aircraft is dangerously close to the ground.

It monitors altitude, descent rate, and terrain closure.

<br><br>

Common warnings include:

<br><br>

<b>SINK RATE</b><br>
<b>TOO LOW TERRAIN</b><br>
<b>PULL UP</b>

<br><br>

Modern aircraft use Enhanced GPWS (EGPWS), which adds terrain databases and GPS information.
`,



"Windshear Detection":

`
<b>Windshear Detection System</b><br><br>

Windshear is a sudden change in wind speed or direction.

It is dangerous because it can rapidly change an aircraft's lift and performance.

<br><br>

It is especially dangerous during:

<br><br>

- Takeoff<br>
- Approach<br>
- Landing

<br><br>

The system detects dangerous wind changes and warns pilots.
`,



"Weather Radar":

`
<b>Weather Radar</b><br><br>

Aircraft weather radar uses radio waves to detect precipitation ahead.

The radar sends signals forward and measures the energy reflected back.

<br><br>

Pilots use radar to avoid:

<br><br>

- Thunderstorms<br>
- Heavy rain<br>
- Severe weather

<br><br>

Weather radar does not detect every hazard, such as clear-air turbulence.
`,



"Predictive Windshear":

`
<b>Predictive Windshear System</b><br><br>

Predictive windshear uses forward-looking radar to detect dangerous wind changes before the aircraft reaches them.

<br><br>

It gives pilots additional warning during:

<br><br>

- Takeoff<br>
- Approach<br>
- Landing

<br><br>

This allows crews to avoid dangerous conditions earlier.
`,



"Stall Warning":

`
<b>Stall Warning System</b><br><br>

A stall happens when a wing loses enough airflow to produce lift.

The system monitors angle of attack and warns pilots before a stall occurs.

<br><br>

Warnings may include:

<br><br>

- Stick shaker<br>
- Audio alerts<br>
- Visual warnings
`,



"Overspeed Warning":

`
<b>Overspeed Warning System</b><br><br>

Aircraft have maximum safe speed limits.

Overspeed warnings alert pilots when those limits are approached or exceeded.

<br><br>

Flying too fast can create dangerous aerodynamic forces and structural stress.
`,



"Altitude Alert":

`
<b>Altitude Alert System</b><br><br>

Altitude alert systems help pilots maintain assigned flight levels.

They warn pilots when approaching or leaving a selected altitude.
`,



"Traffic Display":

`
<b>Traffic Display System</b><br><br>

Traffic displays show nearby aircraft detected by onboard traffic systems.

They improve pilot awareness of surrounding aircraft and airspace.
`

};



title.innerHTML = system;

text.innerHTML = information[system];


}



function closeInfo(){

document.getElementById("info-panel").classList.remove("show");

}


</script>


</body>

</html>
