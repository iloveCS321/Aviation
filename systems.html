<!DOCTYPE html>
<html>

<head>

    <title>Aircraft Systems</title>

    <link rel="stylesheet" href="systems.css">

</head>


<body>


<nav class="navbar">

    <div class="logo">
        AVIATION SYSTEMS
    </div>


    <div class="nav-links">
        <a href="index.html">Home</a>
        <a href="systems.html">Systems</a>
    </div>

</nav>




<h1 class="title">
    AIRCRAFT SYSTEMS
</h1>





<div class="system-grid">


    <div class="system-item" onclick="openInfo('TCAS')">
        TCAS
    </div>


    <div class="system-item" onclick="openInfo('TAWS')">
        TAWS
    </div>


    <div class="system-item" onclick="openInfo('GPWS')">
        GPWS
    </div>


    <div class="system-item" onclick="openInfo('Windshear Detection')">
        Windshear Detection
    </div>


    <div class="system-item" onclick="openInfo('Weather Radar')">
        Weather Radar
    </div>


    <div class="system-item" onclick="openInfo('Predictive Windshear')">
        Predictive Windshear
    </div>


    <div class="system-item" onclick="openInfo('Stall Warning')">
        Stall Warning
    </div>


    <div class="system-item" onclick="openInfo('Overspeed Warning')">
        Overspeed Warning
    </div>


    <div class="system-item" onclick="openInfo('Altitude Alert')">
        Altitude Alert
    </div>


    <div class="system-item" onclick="openInfo('Traffic Display')">
        Traffic Display
    </div>


</div>






<div id="info-panel">


    <button id="close-btn" onclick="closeInfo()">
        ✕
    </button>


    <h2 id="info-title">
        Select a System
    </h2>


    <p id="info-text">
        Click a system to view information.
    </p>


</div>







<script>


function openInfo(system) {


    let title = document.getElementById("info-title");

    let text = document.getElementById("info-text");

    let panel = document.getElementById("info-panel");



    panel.classList.add("show");



    let information = {


        "TCAS":
        "Traffic Collision Avoidance System. Detects nearby aircraft using transponders and provides pilots with collision avoidance advisories.",


        "TAWS":
        "Terrain Awareness and Warning System. Uses GPS, terrain databases, and aircraft data to warn pilots about dangerous terrain.",


        "GPWS":
        "Ground Proximity Warning System. Warns pilots when the aircraft is approaching the ground in an unsafe situation.",


        "Windshear Detection":
        "Detects sudden changes in wind speed and direction that can create dangerous conditions during takeoff and landing.",


        "Weather Radar":
        "Uses radar waves to detect precipitation, storms, and hazardous weather ahead of the aircraft.",


        "Predictive Windshear":
        "Uses forward-looking radar technology to detect windshear before the aircraft enters it.",


        "Stall Warning":
        "Alerts pilots when the aircraft is approaching a stall condition.",


        "Overspeed Warning":
        "Warns pilots when the aircraft exceeds safe speed limits.",


        "Altitude Alert":
        "Alerts pilots when approaching or deviating from a selected altitude.",


        "Traffic Display":
        "Displays nearby aircraft detected through onboard traffic systems."

    };



    title.innerHTML = system;

    text.innerHTML = information[system];


}




function closeInfo() {

    let panel = document.getElementById("info-panel");

    panel.classList.remove("show");

}



</script>



</body>

</html>
