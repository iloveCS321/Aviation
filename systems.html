    Select a System
</h2>

    Click a system to view information.
</p>

<script>

function openInfo(system) {

    let title = document.getElementById("info-title");
    let text = document.getElementById("info-text");
    let panel = document.getElementById("info-panel");

    panel.classList.add("show");

    let information = {

        "TCAS":

        `
        <b>Traffic Collision Avoidance System (TCAS)</b><br><br>

        TCAS is an onboard safety system that helps prevent mid-air collisions. It works independently from Air Traffic Control by communicating with nearby aircraft through their transponders. Every second, TCAS calculates the position, altitude, speed, and direction of surrounding aircraft to determine whether they pose a collision risk.

        <br><br>

        When another aircraft enters a protected zone, TCAS first issues a <b>Traffic Advisory (TA)</b>. This alerts the pilots that another aircraft requires their attention, but no maneuver is required yet.

        <br><br>

        If the aircraft continue toward each other and a collision becomes possible, TCAS issues a <b>Resolution Advisory (RA)</b>. An RA gives a clear vertical command such as:

        <br><br>

        • CLIMB<br>
        • DESCEND<br>
        • MAINTAIN VERTICAL SPEED

        <br><br>

        Modern TCAS systems coordinate with each other automatically. If one aircraft is told to climb, the other receives a command to descend, ensuring both aircraft do not maneuver in the same direction.

        <br><br>

        <b>Golden Rule:</b><br>

        Pilots always follow a TCAS Resolution Advisory immediately, even if it conflicts with an Air Traffic Control instruction. Once the conflict has ended, the crew informs ATC and returns to their assigned clearance.
        `,



        "TAWS":

        `
        <b>Terrain Awareness and Warning System (TAWS)</b><br><br>

        TAWS is designed to prevent Controlled Flight Into Terrain (CFIT), where a perfectly functioning aircraft unintentionally flies into the ground, mountains, or obstacles. It constantly compares the aircraft's location with a detailed terrain database.

        <br><br>

        The system uses information from GPS, altitude, airspeed, vertical speed, and aircraft configuration to predict whether the current flight path will become unsafe.

        <br><br>

        If danger is detected, TAWS warns the pilots with voice alerts such as:

        <br><br>

        • TERRAIN AHEAD<br>
        • TERRAIN, TERRAIN<br>
        • PULL UP

        <br><br>

        TAWS is especially important during night operations, poor weather, low visibility, and flights through mountainous terrain. It provides pilots with valuable time to climb away from terrain before an accident can occur.
        `,



        "GPWS":

        `
        <b>Ground Proximity Warning System (GPWS)</b><br><br>

        GPWS was developed before TAWS and warns pilots when the aircraft is dangerously close to the ground. Unlike TAWS, traditional GPWS does not use GPS or terrain databases. Instead, it monitors the aircraft's altitude and flight performance in real time.

        <br><br>

        GPWS watches factors such as radio altitude, descent rate, terrain closure rate, and aircraft configuration. If unsafe conditions are detected, the system immediately alerts the crew.

        <br><br>

        Common GPWS warnings include:

        <br><br>

        • SINK RATE<br>
        • TOO LOW TERRAIN<br>
        • GLIDE SLOPE<br>
        • PULL UP

        <br><br>

        Modern aircraft usually use Enhanced GPWS (EGPWS), which combines GPWS with GPS and terrain databases to provide earlier and more accurate warnings.
        `,
                "Windshear Detection":

        `
        <b>Windshear Detection System</b><br><br>

        Windshear is a sudden change in wind speed or direction over a very short distance. It is one of the most dangerous weather hazards during takeoff and landing because the aircraft has little altitude available to recover.

        <br><br>

        A strong windshear encounter can cause a rapid loss of airspeed, lift, and climb performance. In severe cases, it can make it difficult for the aircraft to continue climbing after takeoff or maintain a safe approach during landing.

        <br><br>

        The Windshear Detection System continuously monitors aircraft performance and atmospheric conditions. If hazardous windshear is detected, it immediately warns the flight crew so they can perform the appropriate escape maneuver.
        `,



        "Weather Radar":

        `
        <b>Weather Radar</b><br><br>

        Aircraft weather radar helps pilots detect dangerous weather ahead of the aircraft. It sends radio waves forward and measures the energy reflected back from precipitation such as rain, snow, and hail.

        <br><br>

        The radar display uses colors to show precipitation intensity. Green usually represents light precipitation, yellow indicates moderate precipitation, and red often indicates heavy precipitation that may contain severe turbulence or thunderstorms.

        <br><br>

        Pilots use weather radar to safely navigate around storms rather than through them. Although it is extremely useful, weather radar cannot reliably detect clear-air turbulence, so pilots also rely on weather reports and forecasts.
        `,



        "Predictive Windshear":

        `
        <b>Predictive Windshear System</b><br><br>

        Predictive Windshear uses the aircraft's weather radar to detect dangerous windshear before the aircraft enters it. This allows pilots to react before the aircraft is affected.

        <br><br>

        The system is active primarily during takeoff, approach, and landing, when windshear poses the greatest risk. If dangerous conditions are detected, the crew may hear alerts such as:

        <br><br>

        • WINDSHEAR AHEAD<br>
        • GO AROUND, WINDSHEAR AHEAD

        <br><br>

        These early warnings provide valuable time for pilots to reject a takeoff or perform a go-around before entering hazardous conditions.
        `,



        "Stall Warning":

        `
        <b>Stall Warning System</b><br><br>

        A stall occurs when the wing exceeds its critical angle of attack and can no longer produce enough lift. Contrary to popular belief, a stall is caused by excessive angle of attack, not simply by flying too slowly.

        <br><br>

        The Stall Warning System monitors angle of attack, airspeed, and aircraft configuration. As the aircraft approaches a stall, it alerts the pilots with warnings such as a stick shaker, audio alerts, or visual indications.

        <br><br>

        These warnings allow the crew to lower the angle of attack and recover before a full aerodynamic stall develops.
        `,



        "Overspeed Warning":

        `
        <b>Overspeed Warning System</b><br><br>

        Every aircraft has certified maximum operating speeds designed to protect the structure and flight controls. The Overspeed Warning System alerts pilots whenever these limits are approached or exceeded.

        <br><br>

        Flying above these limits can place excessive stress on the aircraft and reduce controllability. Pilots must reduce speed immediately to return the aircraft to a safe operating range.

        <br><br>

        The system helps ensure the aircraft always remains within its certified performance envelope.
        `,



        "Altitude Alert":

        `
        <b>Altitude Alert System</b><br><br>

        The Altitude Alert System assists pilots in maintaining assigned altitudes throughout flight. It compares the aircraft's current altitude with the altitude selected by the flight crew.

        <br><br>

        The system provides visual and audible alerts when approaching the selected altitude and again if the aircraft unintentionally deviates from it.

        <br><br>

        These reminders reduce altitude deviations, improve flight accuracy, and help maintain safe separation from other aircraft.
        `,



        "Traffic Display":

        `
        <b>Traffic Display System</b><br><br>

        The Traffic Display provides pilots with a real-time view of nearby aircraft detected by systems such as TCAS. It displays each aircraft's relative position, altitude difference, and whether it is climbing or descending.

        <br><br>

        This greatly improves situational awareness, especially in busy airspace or around major airports. Pilots can quickly understand the traffic picture and anticipate potential conflicts.

        <br><br>

        While the Traffic Display helps pilots monitor surrounding aircraft, TCAS is still responsible for issuing collision avoidance commands whenever required.
        `

    };

    title.innerHTML = system;
    text.innerHTML = information[system];

}

function closeInfo() {

    document.getElementById("info-panel").classList.remove("show");

}

</script>
